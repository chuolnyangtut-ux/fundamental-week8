<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendWise | Personal Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>SpendWise</h1>
      <p>Smart Personal Finance & Expense Tracker</p>
    </header>

    <section class="balance-card">
      <h2>Current Balance</h2>
      <h3 id="balance">$0.00</h3>
      <div class="summary">
        <div class="income">
          <span>Income</span>
          <p id="money-plus">+$0.00</p>
        </div>
        <div class="expense">
          <span>Expense</span>
          <p id="money-minus">-$0.00</p>
        </div>
      </div>
    </section>

    <section class="transaction-form">
      <h3>Add New Transaction</h3>
      <form id="form">
        <input type="text" id="text" placeholder="Enter description (e.g., Salary, Groceries)" required>
        <input type="number" id="amount" placeholder="Enter amount (+income, -expense)" step="0.01" required>
        <button type="submit">Add Transaction</button>
      </form>
    </section>

    <section class="history">
      <h3>Transaction History</h3>
      <ul id="list" class="list"></ul>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
